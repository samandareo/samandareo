name: commit stars

# Redraws the contribution calendar as a star map every night and publishes the SVGs
# to the `output` branch, which README.md reads. The default branch history stays clean.
on:
  schedule:
    - cron: "17 0 * * *" # 05:17 in Tashkent
  workflow_dispatch:
  push:
    branches: [main]
    paths: [scripts/commit_stars.py, .github/workflows/commit-stars.yml]

permissions:
  contents: write

concurrency:
  group: commit-stars
  cancel-in-progress: true

jobs:
  draw:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Draw the star map
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/commit_stars.py out

      - name: Publish to the output branch
        run: |
          cd out
          git init -q -b output
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -q -m "commit stars: $(date -u +%F)"
          git push -q -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" output
