  <style>
    .s { fill: #1F2328; opacity: var(--o); animation: tw ease-in-out infinite; }
    @keyframes tw { 0%, 100% { opacity: var(--o); } 50% { opacity: calc(var(--o) * 0.25); } }
    .ubl { fill: none; stroke: #1F2328; stroke-opacity: .3; stroke-width: 1; stroke-dasharray: 420; animation: draw 2.6s .6s ease-out both; }
    @keyframes draw { from { stroke-dashoffset: 420; } to { stroke-dashoffset: 0; } }
    .ubs { fill: #1F2328; animation: tw2 3.2s ease-in-out infinite; }
    @keyframes tw2 { 0%, 100% { opacity: .55; } 50% { opacity: 1; } }
    .caret { animation: blink 1s step-end infinite; }
    @keyframes blink { 50% { opacity: 0; } }
    .rise { animation: rise .9s cubic-bezier(.2,.7,.2,1) both; }
    @keyframes rise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
    @media (prefers-reduced-motion: reduce) { .s, .ubl, .ubs, .caret, .rise { animation: none; } }
  </style>
